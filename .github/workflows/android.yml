name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk part-shift-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: part-shift-debug-apk
          path: part-shift-debug.apk
      # Publishing the test build is manual (Actions -> Android APK -> Run workflow), until the game is ready for phones.
      # Every push still builds the APK and keeps it as a workflow artifact.
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          tag_name: android-debug
          name: Android test build
          prerelease: true
          make_latest: false
          body: |
            Debug APK from ${{ github.sha }} (build ${{ github.run_number }}). Install on Android: download, open, allow "install unknown apps".
          files: part-shift-debug.apk
