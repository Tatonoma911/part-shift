app = "part-shift-server"
primary_region = "ams"
kill_signal = "SIGINT"

[build]

[env]
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
